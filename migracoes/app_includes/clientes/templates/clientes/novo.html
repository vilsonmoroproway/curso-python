{% extends "base.html" %}

{% block title %}
Clientes
{% endblock %}

{% block content %}
<div class="mt-2">
    <form method='POST'>
        {% csrf_token %}
        <label>Informe nome</label>
        <input type="text" placeholder="Ex:ana" class="form-control" name="nome" required />
       
        <label>Informe email</label>
        <input type="email" placeholder="Ex:ana@gmail.com" class="form-control" name="email" required />
        
        <label>Informe telefone</label>
        <input type="tel" placeholder="Ex:(47)9090-4567" class="form-control" name="telefone" />

        <div class="mt-3 mb-3 justify-content-between">
            <input type="submit" value="Salvar" class="btn btn-outline-primary" />
            <input type="reset" value="Cancelar" class="btn btn-outline-secondary" />
        </div>
    </form>
</div>
{% endblock %}
