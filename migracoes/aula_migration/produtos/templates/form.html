<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de produto</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body class="container">

    {% if produto %}       
       <h2 class="text-center">Editando produto id: {{produto.id}}</h2>
    {% else %}   
        <h2 class="text-center">Novo produto</h2>
    {% endif %}

    <form method='POST'>
         {% csrf_token %}
         <label>Informe descrição</label>
         <input type="text" 
                placeholder="EX: milho" 
                name="descricao" 
                class="form-control" 
                value="{{ produto.descricao|default:''}} " />

         <label>Informe preço</label>
         <input 
             type="text"
             placeholder="EX: 1.85" 
             name="preco" 
             class="form-control" 
             value="{{ produto.preco|default:''}} "
             />

         <label>Informe estoque</label>
         <input type="text" 
                placeholder="EX: ana" 
                name="estoque"
                 class="form-control" 
                 value="{{ produto.estoque|default:''}} "
                 />

         <div class="mt-3">
            <button class="btn btn-primary">Gravar</button>
            <input type="reset" class="btn btn-secondary" />
         </div>
    </form>
</body>
</html>
