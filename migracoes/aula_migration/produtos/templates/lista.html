|<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="container">
    <h1 class="text-center">Produtos cadastrados</h1>
   <!--<ol>
        {% for produto in produtos %}
           <li>{{ produto.descricao }}</li>
        {% endfor%}
    </ol>--> 
    <table class="table">
        <thead>
            <tr>
                <th>Id</th>
                <th>Descrição</th>
                <th>R$ Unitário</th>
                <th>Disponivel</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for produto in produtos %}
               <tr>
                   <td>{{ produto.id }}</td>
                   <td>{{ produto.descricao }}</td>
                   <td>{{ produto.preco }}</td>
                   <td>{{ produto.estoque }}</td>
                   <td><a href="{% url 'excluir' produto.id %}"><i class="bi bi-trash"></i></a> </td>
                   <td><a href="{% url 'editar' produto.id %}"><i class="bi bi-wrench-adjustable"></i></a> </td>
               </tr>
           {% endfor%}
        </tbody>
    </table>
    <hr />
     <a href="{% url 'novo' %}"><i class="bi bi-sign-intersection" style="font-size: 25px; color: red;"></i></a>
</body>
</html>
